name: Release Stagehand
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stagehand/package-lock.json
      - name: Validate tag and version
        working-directory: stagehand
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm ci
        working-directory: stagehand
      - run: npm run check
        working-directory: stagehand
      - run: npm run package
        working-directory: stagehand
      - uses: actions/upload-artifact@v4
        with:
          name: Stagehand-extension
          path: stagehand/artifacts/*.zip
      - name: Publish release with prebuilt extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" stagehand/artifacts/*.zip --verify-tag --title "Stagehand $GITHUB_REF_NAME" --notes-file stagehand/RELEASE_NOTES.md

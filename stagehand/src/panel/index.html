<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stagehand</title><link rel="stylesheet" href="style.css"></head><body><header><small>THE GAME MASTER’S DESK</small><h1>Stagehand</h1><p id="status">Connecting…</p></header><main><section><h2>Heard</h2><p id="heard">—</p><h2>Did</h2><p id="did">—</p></section><section><h2>Now</h2><p id="now">No cue yet</p><h2>Next</h2><div id="next"></div></section><section class="controls"><button data-command="panic" class="danger">Panic</button><button data-command="stop_all">Kill audio</button><button data-command="previous">Previous</button><button data-command="next">Next</button><button data-command="hide_handout">Hide handout</button><button data-command="repeat">Repeat</button></section><section><h2>State</h2><div id="state"></div></section><section><h2>Cue sheet</h2><div id="cues"></div><h2>Handouts</h2><div id="handouts"></div><h2>Named rolls</h2><div id="rolls"></div><form id="roll-form"><label>Dice expression<input id="formula" placeholder="roll 1d20+5" required></label><button>Roll</button></form></section><section><h2>Last lookup</h2><p id="lookup">—</p><form id="question-form"><label>Ask the digest<input id="question" required></label><button>Ask</button></form></section><section><details id="log-section"><summary>Log</summary><p class="hint">Latest 25 events, newest first.</p><button id="copy-log">Copy log</button><button id="download-log">Download log</button><pre id="log-entries" aria-live="polite"></pre></details></section><p id="error" role="alert"></p><button id="options">Open settings</button></main><script src="index.js"></script></body></html>
